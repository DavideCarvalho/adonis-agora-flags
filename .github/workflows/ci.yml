name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.2
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm build

      - run: pnpm check:package

  # Lint, typecheck and build run once on the pinned version above; only the test
  # suite fans out across every Node line we support (24 and 26: maintained by Node and accepted by AdonisJS 7).
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    name: test (node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

  # Postgres, Redis and ClickHouse in Docker (testcontainers + docker CLI): the SQL, the relay's
  # gap safety, partitions and the OLAP backends against the real thing.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.2
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm --filter @adonis-agora/flags test:integration

  # examples/app: a real AdonisJS app (SQLite, @adonisjs/auth, Bouncer, Shield, Edge) installing the
  # packed tarballs as npm would ship them, driven over real HTTP — including a control-plane and a
  # tenant as two processes — and `node ace configure` on a pristine copy.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.2
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm e2e
